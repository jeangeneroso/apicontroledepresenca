<mat-card>
  <mat-toolbar>
    <span class="titulo-centralizado"> Gestão das Operações </span>

    <span class="spacer"></span>

    <button matFab extended (click)="incluir()" class="botao-incluir">
      <mat-icon>warehouse</mat-icon>
    </button>
  </mat-toolbar>

  <div *ngIf="operacoes$ | async as operacoes; else loading">
    <table mat-table [dataSource]="operacoes" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <span class="header-conteudo">
            ID <mat-icon>account_box</mat-icon>
          </span>
        </th>
        <td mat-cell *matCellDef="let operacao"> {{ operacao.id }} </td>
      </ng-container>

      <ng-container matColumnDef="nomeOperacao">
        <th mat-header-cell *matHeaderCellDef> Nome da Operação
          <mat-icon>warehouse</mat-icon>
        </th>
        <td mat-cell *matCellDef="let operacao">
          {{operacao.nomeOperacao}}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let operacao">

          <button mat-icon-button (click)="edit(operacao)" class="botao-editar" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button (click)="delete(operacao)" class="botao-excluir" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <ng-template #loading>
    <div class="loagind-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</mat-card>
