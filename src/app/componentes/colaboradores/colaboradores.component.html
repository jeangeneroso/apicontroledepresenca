<mat-card>
  <mat-toolbar>
    <span class="titulo-centralizado"> Gestão dos Auxiliares </span>

    <span class="spacer"></span>

    <button matFab extended (click)="incluir()" class="botao-incluir">
      <mat-icon>person_add</mat-icon>
    </button>
  </mat-toolbar>

  <app-compartilhado-list *ngIf="colaboradores$ | async as colaboradores; else loading" [colaboradores]="colaboradores"
    (inclui)="(incluir)"></app-compartilhado-list>

  <ng-template #loading>
    <div class="loagind-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</mat-card>
