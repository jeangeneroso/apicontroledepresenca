<mat-card>
  <mat-toolbar>
    <span class="titulo-centralizado"> Gestão dos Colaboradores </span>

    <span class="spacer"></span>

    <button matFab extended (click)="incluir()" class="botao-incluir">
      <mat-icon>person_add</mat-icon>
    </button>
  </mat-toolbar>

  <div *ngIf="colaboradores$ | async as colaboradores; else loading">
    <table mat-table [dataSource]="colaboradores" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <span class="header-conteudo">
            ID <mat-icon>account_box</mat-icon>
          </span>
        </th>
        <td mat-cell *matCellDef="let colaborador"> {{ colaborador.id }} </td>
      </ng-container>

      <ng-container matColumnDef="nomeColaborador">
        <th mat-header-cell *matHeaderCellDef> Nome do Colaborador
          <mat-icon>person</mat-icon>
        </th>
        <td mat-cell *matCellDef="let colaborador">
          {{colaborador.nomeColaborador}}
        </td>
      </ng-container>

      <ng-container matColumnDef="rgColaborador">
        <th mat-header-cell *matHeaderCellDef> RG do Colaborador
          <mat-icon>pin</mat-icon>
        </th>
        <td mat-cell *matCellDef="let colaborador"> {{colaborador.rgColaborador}} </td>
      </ng-container>

      <ng-container matColumnDef="cpfColaborador">
        <th mat-header-cell *matHeaderCellDef> CPF do Colaborador
          <mat-icon>subtitles</mat-icon>
        </th>
        <td mat-cell *matCellDef="let colaborador"> {{colaborador.cpfColaborador}} </td>
      </ng-container>

      <ng-container matColumnDef="chavePix">
        <th mat-header-cell *matHeaderCellDef> Chave PIX
          <mat-icon>key</mat-icon>
        </th>
        <td mat-cell *matCellDef="let colaborador"> {{colaborador.chavePix}} </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let colaborador">
          
          <button mat-icon-button (click)="edit(colaborador)" class="botao-editar" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button (click)="delete(colaborador)" class="botao-excluir" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <ng-template #loading>
    <div class="loagind-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</mat-card>
