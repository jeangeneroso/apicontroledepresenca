<div class="login-container">
  
  <div class="login-sidebar-image">
    <img src="assets/RPM_logo.jpg" alt="Logo/Imagem do Sistema">
    <img src="assets/GN_logo.jpg" alt="Logo/Imagem do Sistema">
  </div>
  
  <div class="login-content">
    <form (submit)="entrar()" class="login-box">
      <h2> Bem - vindo </h2>
      
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" placeholder="Digite seu usuário">
      </div>
      
      <div class="input-group">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha">
      </div>
      
      <button type="submit" class="btn-acessar">Acessar Sistema</button>
    </form>
  </div>

</div>
